<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Weather & Travel Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>🌍 Smart Weather & Travel</h1>
        <p>Weather-based travel suggestions</p>
    </header>

    <div class="search">
        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name">

        <button onclick="searchCity()">Search</button>
    </div>

    <p id="error"></p>

    <div class="dashboard">

        <div class="card weather">

            <h2 id="city">Search a city</h2>

            <div id="weatherIcon" class="weather-icon">🌤️</div>

            <h3 id="temperature">-- °C</h3>

            <p id="description">Weather details</p>

            <div class="info">
                <p>💧 Humidity: <span id="humidity">--</span>%</p>
                <p>💨 Wind: <span id="wind">--</span> km/h</p>
            </div>

        </div>

        <div class="card">

            <h2>✈️ Travel Suggestions</h2>

            <p id="travelSuggestion">
                Search a city to get travel suggestions.
            </p>

            <div id="travelTips"></div>

        </div>

    </div>

    <div class="card forecast-card">

        <h2>📅 Weather Forecast</h2>

        <div id="forecast" class="forecast"></div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
